name: EAS Update (Expo Go)

# Publishes the real app's JS bundle to Expo's cloud so it opens in Expo Go
# with NO PC. GitHub's runners have open internet, so linking the Expo
# project, configuring it, and publishing all happen here. The only human
# step is adding EXPO_TOKEN once (from a phone). See EAS_PREVIEW.md.

# Manual-only. The Expo project now lives under the bit-serenity-studios-llc
# org (projectId 0d632714…), so this workflow needs an EXPO_TOKEN that belongs
# to — or is a member of — that org. Until such a token is set as a GitHub
# secret, auto-running on push would only produce failing runs, so we require
# an explicit button press (Actions → EAS Update → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write # allow committing the linked projectId back to app.json

jobs:
  update:
    runs-on: ubuntu-latest
    # Accept the Expo token under any of the names that have been used so
    # far: EXPO_TOKEN, the repo secret EXPOAUTH, or the org secret
    # EXPOGO_AUTH_TOKEN. First non-empty wins.
    env:
      EXPO_TOKEN: >-
        ${{ secrets.EXPO_TOKEN != '' && secrets.EXPO_TOKEN
            || (secrets.EXPOAUTH != '' && secrets.EXPOAUTH
                || secrets.EXPOGO_AUTH_TOKEN) }}
    steps:
      - name: Diagnose token presence
        run: |
          echo "EXPO_TOKEN present?        ${{ secrets.EXPO_TOKEN != '' }}"
          echo "EXPOAUTH present?          ${{ secrets.EXPOAUTH != '' }}"
          echo "EXPOGO_AUTH_TOKEN present? ${{ secrets.EXPOGO_AUTH_TOKEN != '' }}"
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::No Expo token found under EXPO_TOKEN, EXPOAUTH, or EXPOGO_AUTH_TOKEN."
            exit 1
          fi
          echo "Token resolved (length ${#EXPO_TOKEN}). Proceeding."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Who am I (sanity check)
        run: eas whoami

      - name: Link the Expo project (first run only)
        run: |
          set -e
          LINKED=$(node -e "try{const id=require('./app.json').expo?.extra?.eas?.projectId;process.stdout.write(id?'yes':'no')}catch(e){process.stdout.write('no')}")
          if [ "$LINKED" = "no" ]; then
            echo "No projectId yet — creating/linking the Expo project…"
            eas init --non-interactive --force
            eas update:configure --non-interactive || true
            git config user.name "eas-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "chore: link EAS project for Expo Go updates [skip ci]" || echo "nothing to commit"
            git push || echo "push skipped (branch protection is fine — the link is cached for this run)"
          else
            echo "Project already linked."
          fi

      - name: Publish update to the preview branch
        run: eas update --branch preview --message "${{ github.event.head_commit.message || 'manual update' }}" --non-interactive
