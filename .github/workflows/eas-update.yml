name: EAS Update (Expo Go)

# Publishes the current JS bundle to Expo's cloud on every push so the game
# opens in Expo Go WITHOUT a PC tunnel. See EAS_PREVIEW.md for the one-time
# setup (Expo account, `eas init`, and the EXPO_TOKEN repo secret).
#
# This job is a no-op until the EXPO_TOKEN secret exists — it exits early so
# pushes don't fail before you've finished setup.

on:
  push:
    branches:
      - main
      - claude/moonpetal-phase-4-economy-ykq7a3
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        id: guard
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN not set — skipping EAS update. See EAS_PREVIEW.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.guard.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.ok == 'true'
        run: npm ci

      - name: Setup EAS
        if: steps.guard.outputs.ok == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        if: steps.guard.outputs.ok == 'true'
        run: eas update --branch preview --message "${{ github.event.head_commit.message || 'manual update' }}" --non-interactive
